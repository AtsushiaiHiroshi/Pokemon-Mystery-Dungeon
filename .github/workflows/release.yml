name: Release Foundry module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate module
        run: npm run validate

      - name: Build module archive
        run: |
          zip -r pokemon-mystery-dungeon.zip \
            module.json LICENSE README.md lang scripts styles \
            -x "*.DS_Store"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            pokemon-mystery-dungeon.zip
