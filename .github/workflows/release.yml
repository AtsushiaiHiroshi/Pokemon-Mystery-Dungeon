name: Release Foundry module

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate packages
        run: npm run validate

      - name: Build system archive
        run: |
          zip -r pokemon-mystery-dungeon-system.zip \
            system.json LICENSE README.md lang scripts styles templates \
            packs/pmd-native-abilities-v1 packs/pmd-native-items-v1 \
            packs/pmd-native-moves-v1 packs/pmd-native-pokemon-v1 \
            packs/pmd-native-starter-pokemon-v1 \
            -x "*.DS_Store" -x "*/LOCK" -x "*/LOG*" -x "*/CURRENT" -x "*/0*.log"

      - name: Build legacy module archive
        run: |
          zip -r pokemon-mystery-dungeon-legacy.zip \
            module.json LICENSE README.md lang scripts styles docs \
            -x "*.DS_Store"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            module.json
            system.json
            pokemon-mystery-dungeon-system.zip
            pokemon-mystery-dungeon-legacy.zip
